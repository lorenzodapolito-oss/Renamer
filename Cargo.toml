[package]
name = "renamer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Renamer: batch file renamer with find/replace, live preview and undo"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.36"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
